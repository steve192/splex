name: Setup landing
description: >-
  Set up Node from frontend-landing/.nvmrc with an npm cache and (by default)
  install landing dependencies. The repository must already be checked out.

inputs:
  install:
    description: Whether to run `npm ci` after setting up Node.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: frontend-landing/.nvmrc
        cache: npm
        cache-dependency-path: frontend-landing/package-lock.json

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: frontend-landing
      run: npm ci
